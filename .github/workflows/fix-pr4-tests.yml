name: Fix PR4 tests
on:
  push:
    branches: [feat/chunked-prefill-fairness]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chunked-prefill-fairness
      - name: Add parser coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/test-arg-parser.cpp')
          s = p.read_text()
          marker = '''    argv = {"binary_name", "-lm", "hello"};\n    assert(false == common_params_parse(argv.size(), list_str_to_char(argv).data(), params, LLAMA_EXAMPLE_COMMON));\n\n    printf("test-arg-parser: test valid usage\\n\\n");\n'''
          repl = '''    argv = {"binary_name", "-lm", "hello"};\n    assert(false == common_params_parse(argv.size(), list_str_to_char(argv).data(), params, LLAMA_EXAMPLE_COMMON));\n\n    // server-only chunked-prefill option rejects negative values\n    argv = {"binary_name", "--prefill-chunk-size", "-1"};\n    assert(false == common_params_parse(argv.size(), list_str_to_char(argv).data(), params, LLAMA_EXAMPLE_SERVER));\n\n    printf("test-arg-parser: test valid usage\\n\\n");\n'''
          if marker not in s:
              raise SystemExit('invalid-usage insertion marker not found')
          s = s.replace(marker, repl, 1)
          marker = '''    argv = {"binary_name", "-lm", "mmap+mlock"};\n    assert(true == common_params_parse(argv.size(), list_str_to_char(argv).data(), params, LLAMA_EXAMPLE_COMMON));\n    assert(params.load_mode == LLAMA_LOAD_MODE_MMAP_MLOCK);\n\n    argv = {"binary_name", "-lm", "dio"};\n'''
          repl = '''    argv = {"binary_name", "-lm", "mmap+mlock"};\n    assert(true == common_params_parse(argv.size(), list_str_to_char(argv).data(), params, LLAMA_EXAMPLE_COMMON));\n    assert(params.load_mode == LLAMA_LOAD_MODE_MMAP_MLOCK);\n\n    {\n        common_params server_params;\n        assert(server_params.prefill_chunk_size == 128);\n\n        argv = {"binary_name", "--prefill-chunk-size", "256"};\n        assert(true == common_params_parse(argv.size(), list_str_to_char(argv).data(), server_params, LLAMA_EXAMPLE_SERVER));\n        assert(server_params.prefill_chunk_size == 256);\n\n        argv = {"binary_name", "--prefill-chunk-size", "0"};\n        assert(true == common_params_parse(argv.size(), list_str_to_char(argv).data(), server_params, LLAMA_EXAMPLE_SERVER));\n        assert(server_params.prefill_chunk_size == 0);\n    }\n\n    argv = {"binary_name", "-lm", "dio"};\n'''
          if marker not in s:
              raise SystemExit('valid-usage insertion marker not found')
          p.write_text(s.replace(marker, repl, 1))
          PY
          rm -f .github/workflows/fix-pr4-tests.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test-arg-parser.cpp .github/workflows/fix-pr4-tests.yml
          git commit -m "test: cover prefill chunk size argument"
          git push origin HEAD:feat/chunked-prefill-fairness
