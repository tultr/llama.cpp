name: Apply chunked prefill implementation

on:
  push:
    branches:
      - feat/chunked-prefill-fairness

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          # common/common.h: add server tuning parameter.
          replace_once(
              "common/common.h",
              "    int32_t checkpoint_min_step = 8192;  // minimum spacing between context checkpoints\n    int32_t cache_ram_mib       = 8192;  // -1 = no limit, 0 - disable, 1 = 1 MiB, etc.\n",
              "    int32_t checkpoint_min_step = 8192;  // minimum spacing between context checkpoints\n    int32_t prefill_chunk_size  = 128;   // max prompt tokens scheduled per update while generation is active; 0 = disabled\n    int32_t cache_ram_mib       = 8192;  // -1 = no limit, 0 - disable, 1 = 1 MiB, etc.\n",
          )

          # common/arg.cpp: add a normal server CLI/env option next to continuous batching.
          replace_once(
              "common/arg.cpp",
              '''    add_opt(common_arg(\n        {"-cb", "--cont-batching"},\n        {"-nocb", "--no-cont-batching"},\n        string_format("whether to enable continuous batching (a.k.a dynamic batching) (default: %s)", params.cont_batching ? "enabled" : "disabled"),\n        [](common_params & params, bool value) {\n            params.cont_batching = value;\n        }\n    ).set_examples({LLAMA_EXAMPLE_SERVER}).set_env("LLAMA_ARG_CONT_BATCHING"));\n''',
              '''    add_opt(common_arg(\n        {"-cb", "--cont-batching"},\n        {"-nocb", "--no-cont-batching"},\n        string_format("whether to enable continuous batching (a.k.a dynamic batching) (default: %s)", params.cont_batching ? "enabled" : "disabled"),\n        [](common_params & params, bool value) {\n            params.cont_batching = value;\n        }\n    ).set_examples({LLAMA_EXAMPLE_SERVER}).set_env("LLAMA_ARG_CONT_BATCHING"));\n    add_opt(common_arg(\n        {"--prefill-chunk-size"}, "N",\n        string_format("max prompt tokens to schedule per server update while text generation is active (0 = disabled, default: %d)", params.prefill_chunk_size),\n        [](common_params & params, int value) {\n            if (value < 0) {\n                throw std::invalid_argument("prefill chunk size must be >= 0");\n            }\n            params.prefill_chunk_size = value;\n        }\n    ).set_examples({LLAMA_EXAMPLE_SERVER}).set_env("LLAMA_ARG_PREFILL_CHUNK_SIZE"));\n''',
          )

          # tools/server/server-context.cpp: preserve generation tokens, then apply an aggregate
          # prompt budget only while generation is active. The budget is shared across prompt slots.
          replace_once(
              "tools/server/server-context.cpp",
              '''        // process in chunks of params.n_batch\n        int32_t n_batch  = llama_n_batch(ctx_tgt);\n        int32_t n_ubatch = llama_n_ubatch(ctx_tgt);\n\n        auto & alora_scale       = batch.alora_scale;\n''',
              '''        // process in chunks of params.n_batch\n        int32_t n_batch  = llama_n_batch(ctx_tgt);\n        int32_t n_ubatch = llama_n_ubatch(ctx_tgt);\n\n        // A large prompt prefill can otherwise occupy a full forward pass and make\n        // already-generating slots effectively stall. When generation is active,\n        // limit only the prompt-token portion of this scheduler update. Generation\n        // and speculative tokens already present in `batch` do not consume this budget.\n        const bool has_active_generation = !generating.empty();\n        const int32_t prefill_budget =\n            has_active_generation && params_base.prefill_chunk_size > 0\n                ? std::min(n_batch, params_base.prefill_chunk_size)\n                : n_batch;\n        int32_t prefill_tokens_added = 0;\n\n        int32_t prompt_slots_remaining = 0;\n        if (has_active_generation && params_base.prefill_chunk_size > 0) {\n            iterate(slots, [&](server_slot & slot) {\n                if (slot.is_processing() &&\n                    (slot.state == SLOT_STATE_PROCESSING_PROMPT || slot.state == SLOT_STATE_STARTED) &&\n                    slot.can_split()) {\n                    prompt_slots_remaining++;\n                }\n            });\n        }\n\n        auto & alora_scale       = batch.alora_scale;\n''',
          )

          replace_once(
              "tools/server/server-context.cpp",
              '''                // this slot still has a prompt to be processed\n                if (slot.state == SLOT_STATE_PROCESSING_PROMPT || slot.state == SLOT_STATE_STARTED) {\n                    const auto & input_tokens = slot.task->tokens;\n\n                    // used to determine the number of tokens added to the batch for the current slot\n                    const auto n_tokens_prev = batch.size();\n''',
              '''                // this slot still has a prompt to be processed\n                if (slot.state == SLOT_STATE_PROCESSING_PROMPT || slot.state == SLOT_STATE_STARTED) {\n                    const auto & input_tokens = slot.task->tokens;\n\n                    const bool limit_prefill =\n                        has_active_generation && params_base.prefill_chunk_size > 0 && slot.can_split();\n\n                    // Divide the remaining aggregate prompt budget among remaining\n                    // splittable prompt slots. This prevents the first long prompt\n                    // from consuming the entire allowance while keeping a hard\n                    // aggregate cap across the scheduler update.\n                    int32_t slot_prefill_budget = n_batch;\n                    if (limit_prefill) {\n                        const int32_t budget_remaining = std::max(0, prefill_budget - prefill_tokens_added);\n                        if (budget_remaining == 0) {\n                            return;\n                        }\n                        slot_prefill_budget = std::max(1,\n                            budget_remaining / std::max(1, prompt_slots_remaining));\n                    }\n\n                    // used to determine the number of tokens added to the batch for the current slot\n                    const auto n_tokens_prev = batch.size();\n''',
          )

          replace_once(
              "tools/server/server-context.cpp",
              '''                    // add prompt tokens for processing in the current batch\n                    while (slot.prompt.n_tokens() < slot.task->n_tokens() && batch.size() < n_batch) {\n''',
              '''                    // add prompt tokens for processing in the current batch\n                    int32_t slot_prefill_tokens_added = 0;\n                    while (slot.prompt.n_tokens() < slot.task->n_tokens() &&\n                           batch.size() < n_batch &&\n                           (!limit_prefill ||\n                            (prefill_tokens_added < prefill_budget &&\n                             slot_prefill_tokens_added < slot_prefill_budget))) {\n''',
          )

          replace_once(
              "tools/server/server-context.cpp",
              '''                        slot.prompt.tokens.push_back(cur_tok);\n\n                        // break at the last user message, or at user messages at least min step past the last checkpoint\n''',
              '''                        slot.prompt.tokens.push_back(cur_tok);\n                        if (limit_prefill) {\n                            prefill_tokens_added++;\n                            slot_prefill_tokens_added++;\n                        }\n\n                        // break at the last user message, or at user messages at least min step past the last checkpoint\n''',
          )

          replace_once(
              "tools/server/server-context.cpp",
              '''                    // the number of tokens added to the batch for the current slot\n                    const auto n_tokens_cur = batch.size() - n_tokens_prev;\n''',
              '''                    if (limit_prefill) {\n                        prompt_slots_remaining = std::max(0, prompt_slots_remaining - 1);\n                    }\n\n                    // the number of tokens added to the batch for the current slot\n                    const auto n_tokens_cur = batch.size() - n_tokens_prev;\n''',
          )

          # Remove the temporary implementation brief and this one-shot workflow.
          Path(".github/roomote/chunked-prefill-fairness.md").unlink(missing_ok=True)
          Path(".github/workflows/apply-chunked-prefill.yml").unlink(missing_ok=True)
          PY

          git diff --check
          git diff

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "server: add configurable chunked prefill fairness"
          git push origin HEAD:feat/chunked-prefill-fairness
